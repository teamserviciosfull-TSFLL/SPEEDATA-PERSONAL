<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Servicios Full · Speedata</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00D1FF; --bg: #0b101a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%; width: 100%; overflow: hidden;
            background: var(--bg); color: var(--primary);
            font-family: 'Orbitron', sans-serif;
        }

        /* Pantalla de Carga y Animaciones */
        .loader-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg); z-index: 10;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loader { text-align: center; cursor: pointer; }

        .fa-satellite-dish {
            font-size: 72px;
            filter: drop-shadow(0 0 18px var(--primary));
            animation: pulse 1.2s ease-in-out infinite;
        }

        p { margin-top: 22px; font-size: 13px; letter-spacing: 6px; text-transform: uppercase; }

        .bar-wrap {
            width: 180px; height: 4px; background: rgba(0,209,255,.15);
            border-radius: 99px; margin: 18px auto 0; overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 209, 255, 0.2);
        }

        .bar-fill {
            height: 100%; background: var(--primary); width: 0%;
            box-shadow: 0 0 12px var(--primary);
            animation: load 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes pulse { 
            0%, 100% { transform: scale(1); opacity: 0.8; } 
            50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 25px var(--primary)); } 
        }

        @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }

        #btn-manual {
            margin-top: 20px; background: transparent;
            border: 1px solid var(--primary); color: var(--primary);
            padding: 10px 20px; font-family: 'Orbitron'; cursor: pointer; display: none;
            transition: all 0.3s ease;
        }

        #btn-manual:hover {
            background: var(--primary); color: var(--bg);
            box-shadow: 0 0 15px var(--primary);
        }
    </style>
</head>
<body>

    <!-- ANIMACIÓN DE ENTRADA (SPLASH) -->
    <div class="loader-container" id="splash">
        <div class="loader" onclick="cargarApp()">
            <i class="fa-solid fa-satellite-dish"></i>
            <p id="status">Iniciando Speedata</p>
            <div class="bar-wrap"><div class="bar-fill"></div></div>
            <button id="btn-manual">ABRIR SISTEMA</button>
        </div>
    </div>

    <script>
        const BASE_URL = "https://script.google.com/macros/s/AKfycbxCVkIUwvWCCCnupdvC08C7Tf8UVnE7u2NyliH7rVIajQAoCkcEXzPtOTr7-3HqiUbrwg/exec";
        let appCargada = false;

        function cargarApp() {
            if (appCargada) return;
            appCargada = true;

            // Redirección directa: Google Apps Script bloquea ser embebido en iframe,
            // así que navegamos directamente a la URL del sistema.
            window.location.href = BASE_URL;
        }

        // Se ejecuta al completar la animación (2.6 segundos)
        setTimeout(() => {
            document.getElementById('status').innerText = "Cargando Interfaz...";
            cargarApp();
        }, 2600);

        // Respaldo de seguridad: si por alguna razón la redirección automática
        // no ocurrió (bloqueador de pop-ups, etc.), mostramos un botón manual.
        setTimeout(() => {
            if (!appCargada) {
                const btn = document.getElementById('btn-manual');
                btn.style.display = "inline-block";
                btn.onclick = () => { window.location.href = BASE_URL; };
                document.getElementById('status').innerText = "Si no cargó, presiona:";
            }
        }, 6000);
    </script>
</body>
</html>
