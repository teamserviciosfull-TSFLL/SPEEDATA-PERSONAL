<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Servicios Full · Speedata</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00D1FF; --bg: #0b101a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%; width: 100%; overflow: hidden;
            background: var(--bg); color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            display: flex; align-items: center; justify-content: center;
        }

        .loader { text-align: center; cursor: pointer; }

        /* Animación del Icono Satélite */
        .fa-satellite-dish {
            font-size: 72px;
            filter: drop-shadow(0 0 18px var(--primary));
            animation: pulse 1.2s ease-in-out infinite;
        }

        p { 
            margin-top: 22px; 
            font-size: 13px; 
            letter-spacing: 6px; 
            text-transform: uppercase; 
        }

        /* Contenedor de la Barra */
        .bar-wrap {
            width: 180px; height: 4px; background: rgba(0,209,255,.15);
            border-radius: 99px; margin: 18px auto 0; overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 209, 255, 0.2);
        }

        /* Animación del Relleno de la Barra (Dura 2.5s) */
        .bar-fill {
            height: 100%; 
            background: var(--primary); 
            width: 0%;
            box-shadow: 0 0 12px var(--primary);
            animation: load 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Keyframes para el Latido */
        @keyframes pulse { 
            0%, 100% { transform: scale(1); opacity: 0.8; } 
            50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 25px var(--primary)); } 
        }

        /* Keyframes para Llenar la Barra */
        @keyframes load { 
            0% { width: 0%; }
            50% { width: 60%; }
            100% { width: 100%; } 
        }
        
        #btn-manual {
            margin-top: 20px;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            font-family: 'Orbitron';
            cursor: pointer;
            display: none;
            transition: all 0.3s ease;
        }

        #btn-manual:hover {
            background: var(--primary);
            color: var(--bg);
            box-shadow: 0 0 15px var(--primary);
        }
    </style>
</head>
<body>

    <div class="loader" onclick="irAApp()">
        <i class="fa-solid fa-satellite-dish"></i>
        <p id="status">Iniciando Speedata</p>
        <div class="bar-wrap"><div class="bar-fill"></div></div>
        <button id="btn-manual">ENTRAR MANUALMENTE</button>
    </div>

    <script>
        const FINAL_URL = "https://script.google.com/macros/s/AKfycbzMMmMV3PfhAAP2xYnioatBlmwdf-8qZDhTANMwwwf6IhjqZQJmOMYt6MoEcXgKFjDLKA/exec";

        function irAApp() {
            window.location.href = FINAL_URL;
        }

        // Redirige justo después de que la barra de carga termina su animación (2.6s)
        setTimeout(() => {
            document.getElementById('status').innerText = "Conectando...";
            irAApp();
        }, 2600);

        // Si tarda más de 5 segundos, muestra el botón manual
        setTimeout(() => {
            document.getElementById('btn-manual').style.display = "inline-block";
            document.getElementById('status').innerText = "Click para entrar";
        }, 5000);
    </script>
</body>
</html
